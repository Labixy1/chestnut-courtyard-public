name: Publish public preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/privacy_scan.py
      - run: python3 scripts/documentation_images_test.py
      - run: node scripts/html_syntax_test.js
      - run: python3 scripts/build_cloud.py --mode preview --hosting static
      - run: python3 scripts/cloud_privacy_test.py
      - run: python3 scripts/pages_preview_test.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
