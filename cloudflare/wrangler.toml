name = "chestnut-courtyard-owner"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "your-owner-domain.example", custom_domain = true }
]

[vars]
COZY_TEXT_PROVIDER = "workers-ai"
COZY_TEXT_FALLBACK_PROVIDER = "workers-ai-fallback"
COZY_TEXT_DISABLED_PROVIDERS = "openai,glm,deepseek"
COZY_DEEPSEEK_MODEL = "deepseek-v4-flash"
COZY_OPENAI_MODEL = "gpt-5.6-luna"
COZY_OPENAI_IMAGE_MODEL = "gpt-image-2"
COZY_GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
COZY_GEMINI_TEXT_MODEL = "gemini-2.5-flash-lite"
COZY_GLM_MODEL = "glm-4.7-flash"
COZY_QWEN_MODEL = "qwen-flash"
COZY_SEEDREAM_MODEL = "doubao-seedream-4-0-250828"
COZY_SEEDANCE_MODEL = "doubao-seedance-2-0-mini-260615"
COZY_WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
COZY_WORKERS_AI_FALLBACK_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
COZY_SEEDREAM_DEFAULT_SIZE = "1K"
COZY_SEEDREAM_DEFAULT_FORMAT = "jpeg"
COZY_OPENAI_IMAGE_DEFAULT_SIZE = "1024x1024"
COZY_OPENAI_IMAGE_DEFAULT_QUALITY = "medium"
COZY_OPENAI_IMAGE_DEFAULT_FORMAT = "webp"
COZY_VIDEO_DEFAULT_RESOLUTION = "480p"
COZY_VIDEO_DEFAULT_DURATION = "5"
COZY_MEDIA_LIMIT_BYTES = "9000000000"
COZY_MEDIA_MAX_FILE_BYTES = "100000000"
PUBLIC_READ_ONLY = "false"
ALLOW_UNAUTHENTICATED = "false"
AUTH_MODE = "passcode"

[assets]
directory = "../dist-owner"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "COZY_STATE"
id = "YOUR_STATE_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "COZY_BACKUP"
id = "YOUR_BACKUP_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "COZY_MEDIA"
bucket_name = "your-private-media-bucket"

[triggers]
# Cloudflare uses 1=Sunday. Names avoid accidentally scheduling Sun/Tue/Thu.
# The later slots are idempotent retries: an existing 08:00 report exits before fetching or calling AI.
crons = ["0 0 * * MON,WED,FRI", "15 0 * * MON,WED,FRI", "45 0 * * MON,WED,FRI", "0 20 * * *", "15 20 * * SAT"]
