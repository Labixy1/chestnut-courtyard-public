<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阿栗 · 产品演示</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#253c38;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #cddbd6;padding-bottom:16px}
    h1{font-size:22px;margin:0}a{color:#35685e}nav{display:flex;gap:20px;padding:20px 0}nav a{padding:8px 0;text-decoration:none;border-bottom:2px solid transparent}nav a[aria-current="page"]{border-color:#35685e;font-weight:600}
    video{display:block;width:100%;max-height:76vh;background:#141b19;object-fit:contain}body[data-device="mobile"] video{width:min(100%,420px);margin:auto}
    footer{display:flex;gap:24px;justify-content:center;padding-top:18px;font-size:14px}
    @media(max-width:600px){main{padding:16px}header{align-items:flex-start}h1{font-size:18px}header a{font-size:13px}video{max-height:72vh}}
  </style>
</head>
<body>
<main>
  <header><h1>阿栗 · 产品演示</h1><a href="../../../index.html">进入小院</a></header>
  <nav aria-label="演示版本"><a href="?device=desktop" data-device="desktop">电脑端 · 30 秒</a><a href="?device=mobile" data-device="mobile">手机端 · 30 秒</a></nav>
  <video controls playsinline preload="metadata" aria-label="阿栗产品演示" poster="../storyboard/04-notice.jpg" src="ali-demo-desktop-30s.mp4"></video>
  <footer><a id="download" href="ali-demo-desktop-30s.mp4" download>下载视频</a><a href="https://github.com/Labixy1/chestnut-courtyard-public">GitHub 项目</a></footer>
</main>
<script>
  const device=new URLSearchParams(location.search).get('device')==='mobile'?'mobile':'desktop';
  const file='ali-demo-'+device+'-30s.mp4';
  document.body.dataset.device=device;
  const video=document.querySelector('video');
  video.src=file;
  if(device==='mobile')video.poster='../../../docs/images/readme-home-mobile.jpg';
  document.getElementById('download').href=file;
  document.querySelector('nav a[data-device="'+device+'"]').setAttribute('aria-current','page');
</script>
</body>
</html>
