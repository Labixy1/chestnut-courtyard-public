<body>
<main class="room">
  <a class="back" href="bedroom.html">← 回卧室</a>
  <section class="panel">
    <header class="archive-header"><div><h1>密阁</h1><p>阿栗为你整理的长期档案</p></div><nav class="archive-tabs" aria-label="档案切换"><button class="archive-tab active" data-archive="growth" onclick="showArchive('growth')">成长档案</button><button class="archive-tab" data-archive="emotional" onclick="showArchive('emotional')">情感档案</button></nav></header>
    <section class="archive-view active" id="growth-archive"><div class="archive-view-title"><h2>成长档案</h2><span id="profile-meta"></span></div><article class="archive-report" id="profile-sections"></article><section class="archive-evidence"><div class="archive-evidence-head"><h3>成长依据</h3><span id="growth-evidence-count"></span></div><div class="evidence-list" id="growth-evidence"></div></section></section>
    <section class="archive-view" id="emotional-archive"><div class="archive-view-title"><h2>情感档案</h2><span id="inner-profile-meta"></span></div><article class="archive-report emotional" id="inner-profile-sections"></article><section class="archive-moments" id="emotional-moments-wrap"><h3>触动时刻</h3><div id="emotional-moments"></div></section><section class="archive-evidence emotional-evidence"><div class="archive-evidence-head"><h3>情感依据</h3><span id="emotional-evidence-count"></span></div><div class="evidence-list" id="emotional-evidence"></div></section></section>
  </section>
</main>
<script>
function esc(str){
  return String(str || '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function sourceName(source){
  return ({
    heart_hollow:'树洞', orchard:'成长田', blackboard:'黑板',
    noticeboard:'公告板', travel:'出发旅行', photo_wall:'照片墙', butler:'阿栗任务',
    private_wing:'密阁', memory_nook:'密阁'
  })[source] || source || '未知';
}
function readableMemory(value){
  let current=String(value||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  for(let index=0;index<2&&/^[\[{]/.test(current);index+=1){
    try{const parsed=JSON.parse(current);const pick=parsed.summary||parsed.score_summary||parsed.content||parsed.text||parsed.statement||parsed.reflection||parsed.reply||parsed.title;if(pick)current=String(pick).trim();else if(Array.isArray(parsed))current=parsed.map(item=>typeof item==='string'?item:(item.summary||item.content||item.text||'')).filter(Boolean).join('；');else return '';}catch(_error){return '';}
  }
  return current.replace(/^旅行感悟[：:]\s*/, '').replace(/\s+/g,' ').trim();
}
function evidenceDate(item){return String(item.date||item.updated_at||item.created_at||item.time||'').slice(0,10);}
function usefulEvidence(item){const text=readableMemory(item.statement||item.summary||item.content||item.text);return text.length>=8&&!/希望阿栗帮忙做一件事|交给阿栗|只回复|测试成功|^OK$|正在处理/.test(text);}
function renderEvidenceGroups(items){
  const groups=new Map();items.slice().sort((a,b)=>evidenceDate(b).localeCompare(evidenceDate(a))).forEach(item=>{const key=sourceName(item.source);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);});
  return [...groups.entries()].map(([name,rows])=>'<section class="evidence-group"><div class="evidence-origin">'+esc(name)+'<span>'+rows.length+' 条记录</span></div><ul class="evidence-excerpts">'+rows.slice(0,4).map(item=>'<li>'+(evidenceDate(item)?'<time>'+esc(evidenceDate(item))+'</time>':'')+esc(readableMemory(item.statement||item.summary||item.content||item.text))+'</li>').join('')+'</ul></section>').join('');
}
const API_ORIGIN = location.protocol === 'file:' ? 'http://127.0.0.1:8766' : '';
let NOOK_MEMORY = null;
let NOOK_DISTILLATION = null;
let ACTIVE_CATEGORY = 'all';
function showArchive(name){
  document.querySelectorAll('.archive-view').forEach(view=>view.classList.toggle('active',view.id===name+'-archive'));
  document.querySelectorAll('.archive-tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.archive===name));
}
function api(path,payload){
  return fetch(API_ORIGIN+path,payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(async response=>{const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'请求失败');return data;});
}
function categoryName(id){const found=(NOOK_MEMORY?.categories||[]).find(item=>item.id===id);return found?.name||'其他';}
function cardKind(kind){return ({fact:'事实',preference:'偏好',experience:'经历',goal:'目标',project:'项目',routine:'习惯',insight:'洞察'})[kind]||'记忆';}
function cardRow(item){
  const candidate=item.status==='candidate';
  const options=(NOOK_MEMORY?.categories||[]).filter(category=>category.status==='active').map(category=>'<option value="'+esc(category.id)+'"'+(category.id===item.category_id?' selected':'')+'>'+esc(category.name)+'</option>').join('');
  const statusAction=candidate?'':'<button onclick="cardAction(\''+esc(item.id)+'\',\'card_candidate\')">移到待确认</button>';
  const scopes=[['learning_format','只调整讲解方式'],['companion_style','只调整陪伴方式'],['topic_selection','只影响选题'],['review_only','只用于复习'],['travel_only','只在相关旅行'],['record_only','只归档']];
  const scopeOptions=scopes.map(option=>'<option value="'+option[0]+'"'+(option[0]===item.scope?' selected':'')+'>'+option[1]+'</option>').join('');
  const menu='<details class="card-more"><summary title="管理这条记忆">⋯</summary><div class="card-more-menu"><label>分类<select onchange="moveCardCategory(\''+esc(item.id)+'\',this.value)">'+options+'</select></label><label>参与范围<select onchange="setCardScope(\''+esc(item.id)+'\',this.value)">'+scopeOptions+'</select></label>'+statusAction+'<button onclick="cardAction(\''+esc(item.id)+'\',\'card_reject\')">忽略</button><button class="danger" onclick="forgetMemory(\''+esc(item.id)+'\')">彻底忘记</button></div></details>';
  return '<article class="memory-card '+(candidate?'candidate':'')+'"><div class="memory-card-top"><span class="memory-kind">'+esc(cardKind(item.kind))+'</span><h3 title="'+esc(item.title||item.statement)+'">'+esc(item.title||item.statement)+'</h3>'+menu+'</div><p>'+esc(item.statement||item.summary)+'</p><div class="memory-evidence">'+esc(categoryName(item.category_id))+' · '+esc(item.evidence_count||1)+' 条依据 · '+esc((scopes.find(option=>option[0]===item.scope)||scopes[scopes.length-1])[1])+'</div>'+(candidate?'<button class="remember-button" onclick="cardAction(\''+esc(item.id)+'\',\'card_activate\')">确认记住</button>':'')+'</article>';
}
function setCategory(id){ACTIVE_CATEGORY=id;renderMemoryNook();}
function renderMemoryNook(){
  const memory=NOOK_MEMORY||{};
  const cards=(memory.cards||[]).filter(item=>!['rejected','superseded'].includes(item.status)&&item.sensitivity!=='sealed');
  const activeCards=cards.filter(item=>item.status==='active');
  const events=memory.events||[];
  const profile=memory.profile||{};
  const growth=profile.archives?.growth||{sections:profile.sections||[]};
  const emotional=profile.archives?.emotional||memory.inner_profile||{};
  const renderSections=(sections,empty)=>(sections||[]).length?(sections||[]).map(section=>'<section class="profile-section"><h3>'+esc(readableMemory(section.title)||'阶段记录')+'</h3><p>'+esc(readableMemory(section.text))+'</p></section>').join(''):'<p class="archive-empty">'+esc(empty)+'</p>';
  document.getElementById('profile-sections').innerHTML=renderSections(growth.sections,'还没有足够内容形成成长档案。');
  const moments=emotional.moments||[];
  const momentTexts=new Set(moments.map(item=>String(item.text||'').replace(/\s+/g,'')));
  const emotionalSections=(emotional.sections||[]).filter(section=>!momentTexts.has(String(section.text||'').replace(/\s+/g,'')));
  document.getElementById('inner-profile-sections').innerHTML=emotionalSections.length?renderSections(emotionalSections,''):moments.length?'':'<p class="archive-empty">还没有足够内容形成情感档案。</p>';
  document.getElementById('emotional-moments-wrap').style.display=moments.length?'block':'none';
  document.getElementById('emotional-moments').innerHTML=moments.map(item=>'<blockquote class="moment">'+esc(item.text)+'<time>'+esc(item.date||'')+'</time></blockquote>').join('');
  document.getElementById('inner-profile-meta').textContent=String(emotional.generated_at||profile.generated_at||'').slice(0,10);
  const profileSource=profile.generator==='ai_distillation'?'AI 已整理':'规则档案';
  document.getElementById('profile-meta').textContent=profileSource+' · '+String(profile.generated_at||'').slice(0,10);
  const emotionalSources=new Set(['heart_hollow','travel']);
  const growthSources=new Set(['blackboard','orchard','noticeboard']);
  const growthEvents=events.filter(item=>growthSources.has(String(item.source||''))&&usefulEvidence(item));
  const growthCards=activeCards.filter(item=>item.scope!=='travel_only'&&item.scope!=='heart_only'&&item.category_id!=='travel-life'&&usefulEvidence(item));
  const emotionalEvents=events.filter(item=>emotionalSources.has(String(item.source||''))&&usefulEvidence(item));
  const uniqueEvidence=items=>items.filter((item,index,list)=>{const key=sourceName(item.source)+'|'+readableMemory(item.statement||item.summary||item.content||item.text);return list.findIndex(other=>sourceName(other.source)+'|'+readableMemory(other.statement||other.summary||other.content||other.text)===key)===index;});
  const growthEvidence=uniqueEvidence([...growthCards,...growthEvents]).slice(0,80);
  const emotionalEvidence=uniqueEvidence(emotionalEvents).slice(0,80);
  document.getElementById('growth-evidence-count').textContent=growthEvidence.length+' 条';
  document.getElementById('growth-evidence').innerHTML=growthEvidence.length?renderEvidenceGroups(growthEvidence):'<p class="archive-empty">还没有可展示的成长记录。</p>';
  document.getElementById('emotional-evidence-count').textContent=emotionalEvidence.length+' 条';
  document.getElementById('emotional-evidence').innerHTML=emotionalEvidence.length?renderEvidenceGroups(emotionalEvidence):'<p class="archive-empty">还没有可展示的树洞或旅行记录。</p>';
}
async function loadNook(){
  if(window.CozyRuntime?.demoStaticSeed&&window.COZY?.demo_memory){
    NOOK_MEMORY=JSON.parse(JSON.stringify(window.COZY.demo_memory));
    NOOK_DISTILLATION=JSON.parse(JSON.stringify(window.COZY.demo_distillation||{}));
    renderMemoryNook();
    return;
  }
  try{
    const [memoryData,distillData] = await Promise.all([api('/api/memory'),api('/api/memory/distillation')]);
    NOOK_MEMORY=memoryData.memory;NOOK_DISTILLATION=distillData.distillation||{};renderMemoryNook();
  }catch(error){
    if(window.CozyRuntime?.demoStaticSeed&&window.COZY?.demo_memory){
      NOOK_MEMORY=JSON.parse(JSON.stringify(window.COZY.demo_memory));
      NOOK_DISTILLATION=JSON.parse(JSON.stringify(window.COZY.demo_distillation||{}));
    }
    renderMemoryNook();
  }
}
function renderDistillation(){
  const state=NOOK_DISTILLATION||{};const running=['queued','running'].includes(state.status);const button=document.getElementById('distill-button');button.disabled=running;button.textContent=running?'整理中…':'立即整理';
  const undo=document.getElementById('distill-undo');undo.style.display=state.recent_runs?.length?'inline-block':'none';
  const labels={completed:'上次整理已完成',failed:'上次整理失败',queued:'等待开始整理',running:'阿栗正在整理记忆档案',restored:'已恢复整理前档案',idle:'尚未进行 AI 整理'};
  const time=String(state.last_success||state.last_run||'').slice(0,16).replace('T',' ');const provider=state.provider?' · '+state.provider:'';
  document.getElementById('distill-status').textContent='每周日 04:00 自动更新 · '+(labels[state.status]||'等待自动整理')+(time?' · '+time:'')+provider+(state.last_error?' · '+state.last_error:'');
}
async function runDistillation(){
  const button=document.getElementById('distill-button');button.disabled=true;button.textContent='整理中…';document.getElementById('distill-status').textContent='阿栗正在整理记忆档案，你可以离开这个页面。';
  try{await api('/api/memory/distill',{force:true});pollDistillation();}catch(error){button.disabled=false;button.textContent='立即整理';document.getElementById('distill-status').textContent='没有开始整理：'+error.message;}
}
async function pollDistillation(){
  try{const result=await api('/api/memory/distillation');NOOK_DISTILLATION=result.distillation||{};renderDistillation();if(NOOKENABLED(NOOK_DISTILLATION)){setTimeout(pollDistillation,1500);}else{await loadNook();}}
  catch(error){document.getElementById('distill-status').textContent='暂时无法读取整理状态：'+error.message;}
}
function NOOKENABLED(state){return state&&['queued','running'].includes(state.status);}
async function undoDistillation(){
  const runId=NOOK_DISTILLATION?.recent_runs?.[0]?.id;if(!runId||!confirm('恢复到上次 AI 整理前的记忆档案吗？'))return;
  try{await api('/api/memory/distill/undo',{run_id:runId});await loadNook();}catch(error){alert(error.message);}
}
async function toggleMemoryAssist(enabled){
  const state=document.getElementById('permission-state');state.textContent=enabled?'正在开启……':'正在关闭……';
  try{await api('/api/permissions',{memory_assist_enabled:enabled});await loadNook();window.CozyButler?.refreshStatus();}
  catch(error){document.getElementById('memory-assist-toggle').checked=!enabled;state.textContent='没有修改成功：'+error.message;}
}
async function moveMemory(id,layer){try{await api('/api/memory/action',{action:'move',id,layer});await loadNook();}catch(error){alert(error.message);}}
async function setPreference(id,action){try{await api('/api/memory/action',{action,id});await loadNook();}catch(error){alert(error.message);}}
async function cardAction(id,action){try{await api('/api/memory/action',{action,id});await loadNook();}catch(error){alert(error.message);}}
async function moveCardCategory(id,categoryId){try{await api('/api/memory/action',{action:'card_move_category',id,category_id:categoryId});await loadNook();}catch(error){alert(error.message);}}
async function setCardScope(id,scope){try{await api('/api/memory/action',{action:'card_scope',id,scope});await loadNook();}catch(error){alert(error.message);}}
async function createCategory(){const name=prompt('新分类叫什么？');if(!name)return;try{const result=await api('/api/memory/action',{action:'category_create',name});ACTIVE_CATEGORY=result.category?.id||'all';await loadNook();}catch(error){alert(error.message);}}
async function renameCategory(id){const current=(NOOK_MEMORY?.categories||[]).find(item=>item.id===id);const name=prompt('新的分类名称',current?.name||'');if(!name||name===current?.name)return;try{await api('/api/memory/action',{action:'category_rename',id,name});await loadNook();}catch(error){alert(error.message);}}
async function mergeCategory(id){const choices=(NOOK_MEMORY?.categories||[]).filter(item=>item.id!==id&&item.status==='active');const names=choices.map(item=>item.name).join('、');const name=prompt('合并到哪个分类？\n'+names);if(!name)return;const target=choices.find(item=>item.name===name||item.id===name);if(!target){alert('没有找到这个分类');return;}try{await api('/api/memory/action',{action:'category_merge',id,target_id:target.id});ACTIVE_CATEGORY=target.id;await loadNook();}catch(error){alert(error.message);}}
async function deleteCategory(id){if(!confirm('删除这个分类吗？其中卡片会移到“其他”。'))return;try{await api('/api/memory/action',{action:'category_delete',id});ACTIVE_CATEGORY='general';await loadNook();}catch(error){alert(error.message);}}
async function forgetMemory(id){if(!confirm('确定彻底忘记这条记忆吗？'))return;try{const result=await api('/api/memory/action',{action:'forget',id});const forgotten=new Set(result.forgotten_ids||[id]);const local=JSON.parse(localStorage.getItem('cozy_memory_events')||'[]').filter(item=>!forgotten.has(String(item.id)));localStorage.setItem('cozy_memory_events',JSON.stringify(local));window.CozyButler?.persistLocal(['cozy_memory_events']);await loadNook();}catch(error){alert(error.message);}}
function renderTasks(tasks){
  const box=document.getElementById('task-list');
  box.innerHTML=tasks.length?tasks.slice(0,20).map(task=>{const raw=String(task.message||task.instruction||'').replace(/\s+/g,' ').trim();const excerpt=raw.length>260?raw.slice(0,260)+'…':raw;const status=({completed:'已完成',running:'进行中',failed:'失败'})[task.status]||task.status;return '<article class="memory-row task-row"><div><h3>'+esc(task.title||task.kind)+'</h3><p>'+esc(excerpt)+'</p><div class="memory-meta">'+esc(task.updated_at||task.started_at||'')+(task.snapshot_id?' · 快照 '+esc(task.snapshot_id):'')+'</div>'+(task.snapshot_id?'<div class="memory-actions"><button onclick="undoSnapshot(\''+esc(task.snapshot_id)+'\')">撤销这次系统修改</button></div>':'')+'</div><span class="task-status">'+esc(status)+'</span></article>';}).join(''):'<article class="memory-row"><p>还没有系统操作卷宗。</p></article>';
}
function renderSkills(catalog){
  const skills=Array.isArray(catalog.skills)?catalog.skills:[];
  const tools=Array.isArray(catalog.tools)?catalog.tools:[];
  const groups=[
    {title:'资讯与学习',names:['curate-news','coach-blackboard','guide-orchard','manage-toolbox','organize-checklist']},
    {title:'生活记录',names:['listen-tree-hollow','archive-travel','curate-photos']},
    {title:'记忆与系统',names:['manage-memory','manage-system','build-skill']},
    {title:'生成与自动化',names:['generate-media','imagegen-assets','remove-background','run-automation']}
  ];
  const toolOwners={
    'curate-news':['parse_and_archive','archive_from_knowledge','add_read_later','move_archive','remove_archive','add_watch_topic','add_source','run_weekly_report','manage_notice_category','search_knowledge'],
    'manage-toolbox':['add_toolbox_item','add_tool_from_link','manage_toolbox_item'],
    'guide-orchard':['manage_growth_seed','manage_knowledge_topic'],
    'archive-travel':['manage_trip'],
    'generate-media':['generate_media','check_media_task'],
    'imagegen-assets':['generate_media'],
    'remove-background':['remove-background'],
    'manage-memory':['remember_memory','remember_preference','manage_preference','manage_memory_card','manage_memory_category','forget_memory','search_memory'],
    'manage-system':['modify_system','system_status'],
    'build-skill':['build_skill'],
    'organize-checklist':['organize-checklist']
  };
  const skillCopy={
    'curate-news':['资讯巡逻','收集、筛选、总结并归档值得关注的 AI 与产品资讯。'],
    'coach-blackboard':['黑板教练','结合资讯、历史答案和记忆出题，完成批改、对照与后续练习。'],
    'guide-orchard':['成长田向导','回应成长困惑，把持续关注沉淀成种子和可更新的知识专题。'],
    'manage-toolbox':['工具管家','新增、分类、更新和推荐真正可使用的 AI 工具。'],
    'organize-checklist':['清单整理','把零散事项整理成带顺序、编号和状态的清单。'],
    'listen-tree-hollow':['树洞倾听','回应树洞倾诉，按天整理记录，并保护私密记忆不流出树洞。'],
    'companion-dialogue':['陪伴对话','在树洞和旅行中灵活选择倾听、换角度、建议、轻松陪聊或温和反驳，并避免重复用同一段记忆。'],
    'archive-travel':['旅行归档','按地点保存旅行日期、照片、描述、感悟和总结。'],
    'curate-photos':['照片集整理','维护照片集、旅行相册、时间顺序和照片位置。'],
    'manage-memory':['记忆整理','保存、检索、沉淀、纠正或忘记来自小院各处的个人记忆。'],
    'manage-system':['掌院修改','按主人要求修改页面、配置、提示词、数据结构和交互逻辑。'],
    'build-skill':['Skill 工匠','现有能力不足时，创建、测试并注册新的可执行 Skill。'],
    'generate-media':['图像与视频生成','调用图片或视频模型生成素材，并把结果保存到小院。'],
    'imagegen-assets':['图像素材生成','生成场景、植物与页面素材，统一风格、尺寸和加载格式。'],
    'remove-background':['OpenCV 智能抠图','从项目图片中分离主体，输出带透明通道的 PNG 或 WebP。'],
    'run-automation':['自动任务','运行资讯巡报、夜间图片、记忆维护、重试和健康检查。']
  };
  const skillByName=new Map(skills.map(skill=>[skill.name,skill]));
  const modules=groups.map(group=>{
    const cards=group.names.map(name=>skillByName.get(name)).filter(Boolean).map(skill=>{
      const count=(toolOwners[skill.name]||[]).length;
      const copy=skillCopy[skill.name]||[skill.name,skill.description||'系统内置 Skill'];
      return '<article class="skill-module"><div class="skill-module-head"><h4>'+esc(skill.name+' · '+copy[0])+'</h4><span class="skill-module-badge">'+(count?count+' 项能力':skill.kind==='executable'?'可执行':'流程')+'</span></div><p>'+esc(copy[1])+'</p></article>';
    }).join('');
    return cards?'<section class="skill-category"><h3>'+group.title+' · '+group.names.filter(name=>skillByName.has(name)).length+'</h3><div class="skill-module-grid">'+cards+'</div></section>':'';
  }).join('');
  const toolNames={parse_and_archive:'网页解析归档',archive_from_knowledge:'知识归档',add_read_later:'加入待读',move_archive:'移动归档',remove_archive:'移出归档',add_watch_topic:'新增关注方向',add_source:'新增媒体源',add_toolbox_item:'新增工具卡',add_tool_from_link:'链接导入工具',manage_toolbox_item:'管理工具卡',manage_trip:'管理旅行',manage_growth_seed:'管理成长种子',manage_knowledge_topic:'管理知识专题',run_weekly_report:'生成资讯巡报',system_status:'系统状态检查',generate_media:'生成图片或视频',check_media_task:'查询生成任务',search_knowledge:'搜索知识库',manage_notice_category:'管理公告板分类',remember_memory:'记录记忆',remember_preference:'记录偏好',manage_preference:'管理偏好',manage_memory_card:'管理记忆卡片',manage_memory_category:'管理记忆分类',forget_memory:'忘记记忆',search_memory:'搜索记忆',modify_system:'修改系统',build_skill:'创建 Skill','organize-checklist':'整理清单','remove-background':'OpenCV 智能抠图'};
  const toolType=tool=>{const name=String(tool.name||'');if(/search|check|status/.test(name))return['read','查询'];if(/generate|run_|build|organize|parse/.test(name))return['execute','执行'];return['write','操作'];};
  const toolCards=tools.map(tool=>{const type=toolType(tool),description=String(tool.description||'').trim()||'由阿栗在需要时调用，完成对应的小院操作。';return '<article class="skill-tool-card"><div class="skill-tool-head"><h4>'+esc(tool.name+' · '+(toolNames[tool.name]||'可调用能力'))+'</h4><span class="skill-tool-type '+type[0]+'">'+type[1]+'</span></div><p>'+esc(description)+'</p></article>';}).join('');
  const box=document.getElementById('skill-list');
  box.innerHTML=skills.length?'<div class="skill-summary">'+skills.length+' 个 Skill 模块 · '+tools.length+' 项可执行能力</div>'+modules+'<details class="skill-tools-details"><summary>Callable Tools · 查看全部 '+tools.length+' 项可调用能力</summary><div class="skill-tool-grid">'+toolCards+'</div></details>':'<div class="empty">还没有注册 Skill</div>';
  const health=catalog.health||{};document.getElementById('skill-health').textContent=health.summary||'尚未验证';
}
async function undoSnapshot(snapshotId){if(!confirm('确定恢复这个快照吗？它之后的系统文件修改会被覆盖。'))return;try{await api('/api/tasks/undo',{snapshot_id:snapshotId});location.reload();}catch(error){alert(error.message);}}
loadNook();
</script>
